<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Продюсер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5E6DB; --ink:#2A2420; --bordo:#9F2549; --blue:#A9D4F7; --blue-d:#6FB4E8;
  --blue-ink:#2E5C82; --blue-soft:#E8F4FE; --mut:#7A6E66; --line:#EADFD6; --card:#FFFFFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#EADBCF;font-family:'Inter',system-ui,sans-serif}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper);color:var(--ink);
  line-height:1.5;padding:14px 14px 44px}
h1,.n,.big,.hero-hi{font-family:'Onest',system-ui,sans-serif}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}

/* ШАПКА С ФОТО */
.hero{position:relative;border-radius:24px;overflow:hidden;margin-bottom:14px;
  background:linear-gradient(160deg,#F1E1D4,#E6D0BF)}
.hero-photo{width:100%;display:block}
.hero-ph{height:330px;display:flex;align-items:center;justify-content:center}
.mono{width:118px;height:118px;border-radius:50%;background:#fff;display:flex;align-items:center;
  justify-content:center;font-family:'Onest';font-weight:700;font-size:42px;color:var(--bordo);
  box-shadow:0 10px 34px rgba(159,37,73,.16)}
.hero-txt{position:absolute;left:0;right:0;bottom:0;padding:20px}
.hero-txt.onphoto{background:linear-gradient(to top,rgba(26,18,12,.62),rgba(26,18,12,.12) 55%,rgba(26,18,12,0))}
.hero-date{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--bordo);margin-bottom:5px}
.hero-txt.onphoto .hero-date{color:#fff;opacity:.92}
.hero-hi{font-weight:700;font-size:29px;line-height:1.06;color:var(--ink)}
.hero-txt.onphoto .hero-hi{color:#fff}
.hero-app{font-size:13px;margin-top:7px;color:var(--mut)}
.hero-txt.onphoto .hero-app{color:#fff;opacity:.92}

.top{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 14px}
.top .prog{font-family:'Onest';font-weight:600;font-size:14px;color:var(--blue-ink)}
.chip{background:var(--blue);color:var(--blue-ink);border-radius:20px;padding:7px 15px;
  font-family:'Onest';font-weight:500;font-size:13px;box-shadow:0 3px 12px rgba(111,180,232,.35)}

.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:13px}
.card>.lbl{display:block;margin-bottom:13px}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:13px;gap:10px}
.hd .lbl{margin:0}
.hd .side{font-size:13px;color:var(--blue-ink);font-weight:500;white-space:nowrap}

.focus{background:linear-gradient(135deg,#BEDFFA,#A9D4F7);border-radius:22px;padding:20px;
  margin-bottom:13px;box-shadow:0 6px 22px rgba(111,180,232,.4);position:relative;overflow:hidden}
.focus .lbl{color:var(--blue-ink);opacity:.75;display:block;margin-bottom:9px}
.focus p{margin:0;font-family:'Onest';font-weight:500;font-size:17px;line-height:1.35;color:#1D3F5C}
.focus .hint{font-size:13px;color:var(--blue-ink);margin-top:9px}
.spark{position:absolute;color:#fff;opacity:.85;font-size:15px}

.prod{padding:14px 0;border-bottom:1px solid var(--line)}
.prod:last-child{border:none;padding-bottom:0}
.prod:first-of-type{padding-top:0}
.prod .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.prod .name{font-family:'Onest';font-weight:500;font-size:15px}
.prod .name b{font-weight:500;color:var(--mut);font-size:13px}
.prod .pc{font-family:'Onest';font-weight:700;font-size:18px;color:var(--bordo)}
.bar{display:flex;gap:5px;margin-bottom:8px}
.seg{flex:1;height:9px;border-radius:20px;background:var(--blue-soft)}
.seg.done{background:var(--blue-d)}
.seg.now{background:var(--bordo)}
.stages{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}
.stages span.now{color:var(--bordo);font-weight:500}

.task{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.task:last-child{border:none;padding-bottom:0}
.box{width:22px;height:22px;border-radius:8px;border:2px solid var(--blue-d);flex:none;display:flex;
  align-items:center;justify-content:center;font-size:13px;color:#fff}
.box.on{background:var(--bordo);border-color:var(--bordo)}
.task .tt{flex:1;font-size:14px}
.task .tt.on{color:var(--mut)}
.task .who{font-size:10px;color:var(--blue-ink);background:var(--blue-soft);padding:3px 9px;border-radius:20px}

.mod{margin:14px 0 2px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.mod:first-of-type{margin-top:2px}
.mod-t{font-family:'Onest';font-weight:700;font-size:14px;color:var(--blue-ink)}
.mod-r{font-size:11px;color:var(--mut);margin-top:1px}
.mod-meta{font-size:12px;color:var(--blue-ink);font-weight:500;white-space:nowrap;display:flex;gap:7px;align-items:center}
.chev{color:var(--mut);font-size:11px}
.lesson{display:flex;align-items:center;gap:12px;padding:11px 0 11px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.lesson:last-child{border:none}
.l-main{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.l-main .t{font-size:14px;line-height:1.3}
.l-main .t.done{color:var(--mut)}
.l-ref{font-size:11px;color:var(--mut);opacity:.85}
.dots{display:flex;gap:4px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--blue-soft)}
.dot.on{background:var(--blue-d)}
.dot.full{background:var(--bordo)}
.st{font-size:11px;color:var(--blue-ink);width:56px;text-align:right;flex:none}

/* РИЛСЫ */
.pipe{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:6px}
.col{background:var(--blue-soft);border-radius:16px;padding:12px 6px;text-align:center}
.col .n{font-weight:700;font-size:20px;display:block;color:var(--blue-ink)}
.col .c{font-size:10px;color:var(--blue-ink);opacity:.75;letter-spacing:.04em;text-transform:uppercase}
.col.hot{background:var(--bordo)}
.col.hot .n,.col.hot .c{color:#fff;opacity:1}
.sub-lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:16px 0 8px;display:flex;justify-content:space-between}
.reel{padding:10px 0;border-bottom:1px solid var(--line)}
.reel:last-child{border:none}
.reel .rtop{display:flex;align-items:center;gap:10px;cursor:pointer}
.reel .rmain{flex:1;min-width:0}
.reel .rmain .t{font-size:14px}
.reel .about{font-size:11px;color:var(--mut);margin-top:1px}
.reel .rdate{font-size:11px;color:var(--blue-ink);background:var(--blue-soft);padding:3px 9px;border-radius:20px;flex:none;white-space:nowrap}
.reel .rdate.bank{color:var(--mut);background:var(--line)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.mini{border:none;border-radius:12px;padding:7px 11px;font-size:12px;font-family:'Onest';font-weight:500;
  background:var(--blue-soft);color:var(--blue-ink);cursor:pointer}
.mini.go{background:var(--bordo);color:#fff}
.mini.gray{background:var(--line);color:var(--mut)}
.mini.stg{background:#fff;border:1px solid var(--line);color:var(--blue-ink)}
.dateinp{display:flex;gap:6px;margin-top:8px;align-items:center}

.sched .day{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.sched .day:last-child{border:none}
.sched .dlab{width:64px;flex:none;font-size:12px;color:var(--mut);padding-top:2px}
.sched .day.today .dlab{color:var(--bordo);font-weight:600}
.sched .dbody{flex:1;min-width:0}
.sched .ditem{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}
.sched .ditem .dt{flex:1;min-width:0}
.sched .add{font-size:12px;color:var(--blue-ink);cursor:pointer;opacity:.7}
.sched .empty{font-size:12px;color:#C9BCB1}

.form{background:var(--blue-soft);border-radius:14px;padding:12px;margin:10px 0;display:flex;flex-direction:column;gap:8px}
.form input,.form select{border:1px solid #CFE3F6;border-radius:12px;padding:11px 12px;font-size:14px;
  font-family:inherit;background:#fff;color:var(--ink);width:100%}
.form .r2{display:flex;gap:8px}
.btn{background:var(--blue);color:var(--blue-ink);border:none;border-radius:16px;padding:12px 18px;
  font-family:'Onest';font-weight:500;font-size:14px;cursor:pointer;box-shadow:0 3px 12px rgba(111,180,232,.35)}
.btn.wide{width:100%}
.btn.dark{background:var(--ink);color:var(--paper);box-shadow:none}
.btn.ghost{background:transparent;color:var(--mut);box-shadow:none}

.find{background:var(--blue-soft);border-radius:14px;padding:12px 15px;margin-bottom:8px}
.find .w{font-size:13px;font-weight:500}
.find .a{font-size:12px;color:var(--blue-ink);margin-top:3px}
.two{display:flex;gap:20px;margin-bottom:13px}
.two div .n{font-weight:700;font-size:23px;display:block;line-height:1.1;color:var(--blue-ink)}
.two div .c{font-size:11px;color:var(--mut)}

.shelf{display:flex;align-items:center;justify-content:space-between}
.big{font-weight:700;font-size:34px;line-height:1;color:var(--blue-ink)}
.sub{font-size:13px;color:var(--mut);margin-top:4px}
.foot{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.foot .card{margin:0;text-align:center;padding:16px}
.foot .n{font-weight:700;font-size:25px;display:block;color:var(--blue-ink)}
.foot .c{font-size:11px;color:var(--mut);margin-top:3px}
.xpbar{height:10px;background:var(--blue-soft);border-radius:20px;overflow:hidden;margin-top:10px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue-d),var(--bordo));border-radius:20px}
.xprow{display:flex;justify-content:space-between;font-size:13px}
.xprow b{font-family:'Onest';font-weight:500}
.xprow span{color:var(--mut)}
.demo{background:#E8F4FE;color:#2E5C82;border-radius:14px;padding:12px 15px;font-size:12px;margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--blue);color:var(--blue-ink);
  padding:12px 22px;border-radius:20px;font-size:14px;font-weight:500;opacity:0;transition:opacity .25s;
  pointer-events:none;z-index:9;box-shadow:0 5px 18px rgba(111,180,232,.45)}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<div class="toast" id="toast"></div>

<script>
if(window.Telegram && Telegram.WebApp){ Telegram.WebApp.ready(); Telegram.WebApp.expand(); }
var D=null, app=document.getElementById('app');
var openMods={}, ui={reel:false, reelDate:null, find:false, openReel:null, dateFor:null, editReel:null, openFind:null, editFind:null};

/* helpers */
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.className='toast on';
  clearTimeout(e._t);e._t=setTimeout(function(){e.className='toast'},1600);
  try{if(Telegram.WebApp.HapticFeedback)Telegram.WebApp.HapticFeedback.impactOccurred('light')}catch(e){}}
function pad(n){return n<10?'0'+n:''+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today0(){var d=new Date();d.setHours(0,0,0,0);return d}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function daysLeft(s){return Math.max(0,Math.ceil((new Date(s)-new Date())/864e5))}
function plural(n,a){n=Math.abs(n)%100;var m=n%10;if(n>10&&n<20)return a[2];if(m>1&&m<5)return a[1];if(m==1)return a[0];return a[2]}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;')}
var WD=['вс','пн','вт','ср','чт','пт','сб'], WDF=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
var MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function dLab(d){return WD[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()].slice(0,3)}
function greeting(){var h=new Date().getHours();return h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер'}
function migrate(){ D.reels.forEach(function(r){ if(r.date===undefined)r.date=null; if(r.done===undefined)r.done=false; if(r.stage===undefined)r.stage=0; if(r.about===undefined)r.about=''; }); }

/* persistence: Telegram CloudStorage → localStorage */
function save(){ try{ var s=JSON.stringify(D);
  if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.CloudStorage){Telegram.WebApp.CloudStorage.setItem('producer_v2',s)}
  else{localStorage.setItem('producer_v2',s)} }catch(e){} }
function load(cb){ try{
  if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.CloudStorage){
    Telegram.WebApp.CloudStorage.getItem('producer_v2',function(err,val){cb(val||null)});return; } }catch(e){}
  try{cb(localStorage.getItem('producer_v2'))}catch(e){cb(null)} }

function render(){
  var isoT=iso(today0()), isoTom=iso(addDays(today0(),1));
  var bank=D.reels.filter(function(r){return !r.done && !r.date});
  var planned=D.reels.filter(function(r){return !r.done && r.date});
  var todayReels=D.reels.filter(function(r){return !r.done && r.date===isoT});
  var doneCnt=D.reels.filter(function(r){return r.done}).length;
  var mini=D.lessons, lDone=mini.filter(function(l){return l.stage===3}).length;
  var pctAll=Math.round((mini.reduce(function(s,x){return s+x.stage},0)/(mini.length*3))*100);
  var dl=daysLeft(D.launch.date), h='';

  /* ШАПКА */
  h+='<div class="hero">';
  if(D.header && D.header.photo){
    var photoSrc=D.header.photo;
    if(!/^https?:/.test(photoSrc)) photoSrc='https://yuliyabella.github.io/producer-miniapp/'+photoSrc;
    h+='<img class="hero-photo" src="'+photoSrc+'" alt="Юлия">';
    h+='<div class="hero-txt onphoto">';
  } else {
    h+='<div class="hero-ph"><div class="mono">Ю</div></div><div class="hero-txt">';
  }
  h+='<div class="hero-date">'+dLab(new Date())+'</div>'+
     '<div class="hero-hi">'+greeting()+', Юлия</div>'+
     '<div class="hero-app">'+esc(D.header?D.header.app:'Продюсер')+' · до запуска '+dl+' '+plural(dl,['день','дня','дней'])+'</div>';
  h+='</div></div>';

  h+='<div class="top"><span class="prog">Курс готов на '+pctAll+'%</span>'+
     '<span class="chip">'+lDone+' из '+mini.length+' уроков</span></div>';

  /* КАДР ДНЯ */
  var f,hint;
  if(todayReels.length>0){f='Сегодня в плане '+todayReels.length+' '+plural(todayReels.length,['рилс','рилса','рилсов'])+'. Сделай под ключ.';hint='Готово — один тап по «Сделано».';}
  else if(bank.length<2){f='Банк идей пустеет. Придумай пару тем сегодня.';hint='Загляни в Разведку — оттуда идеи приходят быстрее.';}
  else if(planned.length===0){f='Идеи есть. Наметь съёмку — перекинь идею на день.';hint='Тапни идею в банке → «Сегодня» или «Завтра».';}
  else{f='План на неделю расставлен. Двигайся по расписанию.';hint='Сделала рилс — отметь «Сделано».';}
  h+='<div class="focus"><span class="spark" style="top:14px;right:22px">✦</span><span class="spark" style="bottom:18px;right:44px;font-size:11px">✦</span>'+
     '<span class="lbl">кадр дня</span><p>'+f+'</p><div class="hint">'+hint+'</div></div>';

  /* ЗАПУСК */
  h+='<div class="card"><span class="lbl">запуск</span>';
  D.products.forEach(function(p){
    h+='<div class="prod"><div class="row"><span class="name">'+esc(p.name)+(p.price?' <b>· '+p.price+' ₽</b>':'')+'</span><span class="pc">'+p.percent+'%</span></div><div class="bar">';
    p.stages.forEach(function(s,i){h+='<i class="seg '+(i<p.current?'done':i===p.current?'now':'')+'"></i>'});
    h+='</div><div class="stages">';
    p.stages.forEach(function(s,i){h+='<span class="'+(i===p.current?'now':'')+'">'+s+'</span>'});
    h+='</div></div>';
  });
  h+='</div>';

  /* СБОРКА */
  var tdone=D.build.filter(function(t){return t.done}).length;
  h+='<div class="card"><div class="hd"><span class="lbl">сборка запуска</span><span class="side">'+tdone+' из '+D.build.length+'</span></div>';
  D.build.forEach(function(t,k){
    h+='<div class="task" onclick="toggleTask('+k+')"><span class="box '+(t.done?'on':'')+'">'+(t.done?'✓':'')+'</span>'+
       '<span class="tt '+(t.done?'on':'')+'">'+esc(t.title)+'</span><span class="who">'+esc(t.who)+'</span></div>';
  });
  h+='</div>';

  /* УРОКИ */
  h+='<div class="card"><div class="hd"><span class="lbl">уроки · '+esc((D.courseName&&D.courseName.mine)||(D.header&&D.header.app)||'курс')+'</span><span class="side">залито '+lDone+' из '+mini.length+'</span></div>';
  D.modules.forEach(function(m){
    var ls=mini.filter(function(l){return l.module===m.id}); if(!ls.length)return;
    var md=ls.filter(function(l){return l.stage===3}).length, open=openMods[m.id];
    h+='<div class="mod" onclick="toggleMod(\''+m.id+'\')"><div><div class="mod-t">'+esc(m.title)+'</div><div class="mod-r">'+esc(m.ref)+'</div></div>'+
       '<div class="mod-meta">'+md+'/'+ls.length+'<span class="chev">'+(open?'▾':'▸')+'</span></div></div>';
    if(open){ ls.forEach(function(l){
      h+='<div class="lesson" onclick="moveLesson(\''+l.id+'\')"><div class="dots">';
      for(var i=0;i<4;i++)h+='<i class="dot '+(i<=l.stage?(l.stage===3?'full':'on'):'')+'"></i>';
      h+='</div><div class="l-main"><span class="t '+(l.stage===3?'done':'')+'">'+esc(l.title)+'</span>'+
         '<span class="l-ref">'+esc(l.ref)+'</span></div><span class="st">'+D.lessonStages[l.stage]+'</span></div>';
    }); }
  });
  h+='</div>';

  /* РИЛСЫ */
  h+='<div class="card"><div class="hd"><span class="lbl">рилсы</span><span class="side">в банке '+bank.length+' · сегодня '+todayReels.length+'</span></div>';
  h+='<div class="pipe">'+
     '<div class="col'+(bank.length<2?' hot':'')+'"><b class="n">'+bank.length+'</b><span class="c">В банке</span></div>'+
     '<div class="col"><b class="n">'+planned.length+'</b><span class="c">В плане</span></div>'+
     '<div class="col"><b class="n">'+doneCnt+'</b><span class="c">Сделано</span></div></div>';

  if(ui.reel){
    h+='<div class="form"><input id="rt" placeholder="Название рилса" autocomplete="off">'+
       '<input id="ra" placeholder="О чём (по желанию)" autocomplete="off">'+
       '<div class="r2"><select id="rwhen"><option value="bank">В банк идей</option><option value="today">Сегодня</option><option value="tomorrow">Завтра</option><option value="date">Своя дата →</option></select>'+
       '<input id="rdate" type="date" value="'+isoT+'"></div>'+
       '<div class="r2"><button class="btn wide" onclick="addReel()">Сохранить</button><button class="btn ghost" onclick="closeForms()">Отмена</button></div></div>';
  } else {
    h+='<button class="btn wide" onclick="openReel()">+ рилс</button>';
  }

  /* банк */
  h+='<div class="sub-lbl"><span>Банк идей</span><span>'+bank.length+'</span></div>';
  if(!bank.length) h+='<div class="empty" style="font-size:12px;color:#C9BCB1;padding:4px 0">Пусто. Накидай идей кнопкой «+ рилс».</div>';
  bank.forEach(function(r){ h+=reelRow(r,isoT,isoTom); });

  /* расписание */
  h+='<div class="sub-lbl"><span>Расписание · 2 недели</span><span></span></div><div class="sched">';
  for(var i=0;i<(D.scheduleDays||14);i++){
    var d=addDays(today0(),i), ds=iso(d), isTod=(ds===isoT);

function reelRow(r,isoT,isoTom){
  var open=ui.openReel===r.id, sLabel=['идея','снято','монтаж'][r.stage||0];
  if(ui.editReel===r.id){
    return '<div class="reel"><div class="form"><input id="ert" value="'+esc(r.title)+'" autocomplete="off">'+
      '<input id="era" value="'+esc(r.about||'')+'" placeholder="О чём (по желанию)" autocomplete="off">'+
      '<div class="r2"><button class="btn wide" onclick="saveReelEdit(\''+r.id+'\')">Сохранить</button><button class="btn ghost" onclick="closeReelEdit()">Отмена</button></div></div></div>';
  }
  var s='<div class="reel"><div class="rtop" onclick="tapReel(\''+r.id+'\')"><div class="rmain"><div class="t">'+esc(r.title)+'</div>'+
        (r.about?'<div class="about">'+esc(r.about)+'</div>':'')+'</div>'+
        '<span class="rdate bank">'+sLabel+'</span></div>';
  if(open){
    s+='<div class="acts">'+
       '<button class="mini" onclick="setDate(\''+r.id+'\',\''+isoT+'\')">Сегодня</button>'+
       '<button class="mini" onclick="setDate(\''+r.id+'\',\''+isoTom+'\')">Завтра</button>'+
       '<button class="mini" onclick="pickDate(\''+r.id+'\')">📅 дата</button>'+
       '<button class="mini stg" onclick="cycleStage(\''+r.id+'\')">'+sLabel+' →</button>'+

  return s+'</div>';
}

/* actions */
function addXP(n){D.level.xp+=n;if(D.level.xp>=D.level.xpNext){D.level.xp-=D.level.xpNext;D.level.name=D.level.next;D.level.next='Шоураннер';D.level.xpNext=800;toast('Новый уровень: '+D.level.name)}}
function toggleMod(id){openMods[id]=!openMods[id];render()}
function toggleTask(k){D.build[k].done=!D.build[k].done;addXP(D.build[k].done?15:0);save();render()}
function moveLesson(id){var l=D.lessons.find(function(x){return x.id===id});l.stage=(l.stage+1)%4;addXP(l.stage===3?10:3);
  var same=D.lessons.filter(function(x){return x.product===l.product});var p=D.products.find(function(x){return x.id===l.product});
  p.percent=Math.round(same.reduce(function(s,x){return s+x.stage},0)/(same.length*3)*100);
  toast(D.lessonStages[l.stage]+' · '+l.title);save();render();}
function closeForms(){ui.reel=false;ui.find=false;ui.reelDate=null;render()}
function openReel(){ui.reel=true;ui.find=false;ui.reelDate=null;render()}
function openReelFor(ds){ui.reel=true;ui.reelDate=ds;render();setTimeout(function(){var s=document.getElementById('rwhen');if(s){s.value='date';document.getElementById('rdate').value=ds}},30)}
function addReel(){var t=(document.getElementById('rt').value||'').trim();if(!t){toast('Впиши название');return}
  var a=(document.getElementById('ra').value||'').trim();var w=document.getElementById('rwhen').value;var dv=document.getElementById('rdate').value;
  var date=null; if(ui.reelDate)date=ui.reelDate; else if(w==='today')date=iso(today0()); else if(w==='tomorrow')date=iso(addDays(today0(),1)); else if(w==='date')date=dv;
  D.reels.unshift({id:'n'+Date.now(),title:t,about:a,date:date,stage:0,done:false,source:'своя'});
  addXP(1);ui.reel=false;ui.reelDate=null;toast(date?'В расписании':'В банке');save();render();}
function tapReel(id){ui.openReel=ui.openReel===id?null:id;ui.dateFor=null;render()}
function pickDate(id){ui.dateFor=id;render()}
function setDate(id,ds){if(!ds)return;var r=D.reels.find(function(x){return x.id===id});r.date=ds;ui.openReel=null;ui.dateFor=null;toast('Запланировано');save();render()}
function toBank(id){var r=D.reels.find(function(x){return x.id===id});r.date=null;ui.openReel=null;save();render()}
function cycleStage(id){var r=D.reels.find(function(x){return x.id===id});r.stage=((r.stage||0)+1)%3;addXP(1);save();render()}
function doneReel(id){var r=D.reels.find(function(x){return x.id===id});r.done=true;r.date=null;ui.openReel=null;addXP(5);toast('Готово! Рилс на полке');save();render()}
function delReel(id){var i=D.reels.findIndex(function(x){return x.id===id});if(i>-1)D.reels.splice(i,1);ui.openReel=null;save();render()}
function undoDone(id){var r=D.reels.find(function(x){return x.id===id});r.done=false;toast('Вернула в работу');save();render()}
function editReel(id){ui.editReel=id;ui.openReel=null;render()}
function closeReelEdit(){ui.editReel=null;render()}
function saveReelEdit(id){var t=(document.getElementById('ert').value||'').trim();if(!t){toast('Впиши название');return}
  var a=(document.getElementById('era').value||'').trim();var r=D.reels.find(function(x){return x.id===id});
  r.title=t;r.about=a;ui.editReel=null;toast('Обновлено');save();render();}
function tapFind(id){ui.openFind=ui.openFind===id?null:id;render()}
function editFind(id){ui.editFind=id;ui.openFind=null;render()}
function closeFindEdit(){ui.editFind=null;render()}
function saveFindEdit(id){var w=(document.getElementById('efw').value||'').trim();if(!w){toast('Впиши, что зацепило');return}
  var a=(document.getElementById('efa').value||'').trim();if(!a){toast('Без своего угла — это копия');return}
  var f=D.scouting.finds.find(function(x){return x.id===id});f.what=w;f.angle=a;ui.editFind=null;toast('Обновлено');save();render();}
function delFind(id){var i=D.scouting.finds.findIndex(function(x){return x.id===id});if(i>-1)D.scouting.finds.splice(i,1);ui.openFind=null;toast('Удалено');save();render();}
function openFind(){ui.find=true;ui.reel=false;render()}
function addFind(){var w=(document.getElementById('fw').value||'').trim();if(!w){toast('Впиши, что зацепило');return}
  var a=(document.getElementById('fa').value||'').trim();if(!a){toast('Без своего угла — это копия');return}
  D.scouting.finds.unshift({id:'f'+Date.now(),what:w,angle:a});D.scouting.todayIdeas++;D.scouting.weekIdeas++;
  D.reels.unshift({id:'n'+Date.now(),title:a,about:'из разведки',date:null,stage:0,done:false,source:'разведка'});
  addXP(2);ui.find=false;toast('Находка в банке');save();render();}
